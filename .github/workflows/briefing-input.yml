name: briefing input

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python scripts/build_briefing_input.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add briefing-input.json
          git commit -m "briefing input" || echo "nothing changed"
          git pull --rebase
          git push
